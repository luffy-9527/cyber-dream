
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14172e"/>
      <stop offset="100%" stop-color="#0a0c1a"/>
    </linearGradient>

    <!-- Neon Cyan Glow -->
    <filter id="neonGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Red Glow -->
    <filter id="neonGlowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="112" />

  <!-- Outer Glass Border -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="4" />
  
  <!-- Subtle grid lines -->
  <line x1="256" y1="0" x2="256" y2="512" stroke="rgba(69, 123, 157, 0.1)" stroke-width="2" stroke-dasharray="8 8" />
  <line x1="0" y1="256" x2="512" y2="256" stroke="rgba(69, 123, 157, 0.1)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Center Symbol: Cyber Eye / Moon / Core -->
  <g transform="translate(256, 256)">
    <!-- Red Outer Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#bc312c" stroke-width="6" stroke-dasharray="20 15 50 15" filter="url(#neonGlowRed)" transform="rotate(45)" />
    
    <!-- Cyan Inner Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#457b9d" stroke-width="12" filter="url(#neonGlowCyan)" />
    
    <!-- Digital nodes on Cyan ring -->
    <circle cx="110" cy="0" r="12" fill="#fff" filter="url(#neonGlowCyan)" />
    <circle cx="-110" cy="0" r="12" fill="#fff" filter="url(#neonGlowCyan)" />
    <circle cx="0" cy="-110" r="12" fill="#fff" filter="url(#neonGlowCyan)" />
    
    <!-- Core Diamond / Subconscious shard -->
    <polygon points="0,-60 60,0 0,60 -60,0" fill="#457b9d" opacity="0.3" filter="url(#neonGlowCyan)" />
    <polygon points="0,-40 40,0 0,40 -40,0" fill="#fff" filter="url(#neonGlowCyan)" />
  </g>
</svg>
